<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>历史记录</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 22px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
    th, td { border: 1px solid #e3e3e3; padding: 8px 10px; text-align: left; }
    th { background: #f5f7fa; }
    tr:nth-child(even) { background: #fafafa; }
    .chf { color: #c0392b; font-weight: 700; }
    .normal { color: #1e8449; font-weight: 700; }
    a { color: #2b6cb0; text-decoration: none; }
  </style>
</head>
<body>
  <h1>💓 历史记录</h1>
  <table>
    <thead>
      <tr><th>时间</th><th>记录</th><th>判定</th><th>心衰概率</th><th>切片数</th></tr>
    </thead>
    <tbody>
      {% for r in rows %}
        <tr>
          <td>{{ r[0] }}</td>
          <td>{{ r[1] }}</td>
          <td class="{{ 'chf' if r[2] == '心衰 (CHF)' else 'normal' }}">{{ r[2] }}</td>
          <td>{{ "%.4f"|format(r[3]) }}</td>
          <td>{{ r[4] }}</td>
        </tr>
      {% else %}
        <tr><td colspan="5" style="text-align:center;color:#999;">暂无记录</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <p><a href="{{ url_for('index') }}">← 返回检测</a></p>
</body>
</html>
